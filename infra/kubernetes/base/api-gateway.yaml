apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sull-ai
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: sull-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/sull-ai/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sull-platform-config
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: PORT
              value: "8080"
            - name: IDENTITY_SERVICE_URL
              value: http://identity-service.sull-ai.svc.cluster.local:8080
            - name: TENANT_SERVICE_URL
              value: http://tenant-service.sull-ai.svc.cluster.local:8080
            - name: USER_SERVICE_URL
              value: http://user-service.sull-ai.svc.cluster.local:8080
            - name: AGENT_ORCHESTRATOR_URL
              value: http://agent-orchestrator.sull-ai.svc.cluster.local:8080
            - name: MODEL_GATEWAY_URL
              value: http://model-gateway.sull-ai.svc.cluster.local:8080
            - name: RAG_SERVICE_URL
              value: http://rag-service.sull-ai.svc.cluster.local:8080
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GATEWAY_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: REDIS_URL
            - name: JWT_ISSUER
              value: https://auth.sull.ai
            - name: JWKS_URL
              value: http://identity-service.sull-ai.svc.cluster.local:8080/.well-known/jwks.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sull-ai
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: sull-ai
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: api.sull.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

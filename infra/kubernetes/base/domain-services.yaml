apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sull-ai
  labels:
    app.kubernetes.io/name: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
    spec:
      serviceAccountName: sull-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-service
          image: ghcr.io/sull-ai/user-service:0.1.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sull-platform-config
          env:
            - name: SERVICE_NAME
              value: user-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: REDIS_URL
            - name: JWT_ISSUER
              value: https://auth.sull.ai
            - name: JWKS_URL
              value: http://identity-service.sull-ai.svc.cluster.local:8080/.well-known/jwks.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sull-ai
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http

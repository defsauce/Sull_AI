{{- if .Values.identityService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.identityService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: identity-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.identityService.image.repository }}:{{ .Values.identityService.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_NAME
              value: identity-service
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
          resources:
            {{- toYaml .Values.identityService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}

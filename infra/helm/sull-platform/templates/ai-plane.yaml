{{- if .Values.agentOrchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  labels:
    app.kubernetes.io/name: agent-orchestrator
spec:
  replicas: {{ .Values.agentOrchestrator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-orchestrator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: agent-orchestrator
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.agentOrchestrator.image.repository }}:{{ .Values.agentOrchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_NAME
              value: agent-orchestrator
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
spec:
  selector:
    app.kubernetes.io/name: agent-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
---

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: tenant-service
    metrics_path: /metrics
    static_configs:
      - targets: ["tenant-service:8080"]
